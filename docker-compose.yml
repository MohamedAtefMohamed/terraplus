services:
  backend:
    build:
      context: ./backend
    container_name: terraplus-backend
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      DATA_MODE: ${DATA_MODE:-demo}
      LIVE_DISCOVERY_ENABLED: ${LIVE_DISCOVERY_ENABLED:-true}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      ENABLE_LLM_NARRATION: ${ENABLE_LLM_NARRATION:-false}
    volumes:
      - terraplus-data:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    container_name: terraplus-frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  terraplus-data:
